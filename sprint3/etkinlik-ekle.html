<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Etkinlik Ekle</title>
    <link rel="stylesheet" href="css/2416501067.css">
    <script type="module" src="js/event-form.js"></script>
</head>
<body>
    <header>
        <h1>Etkinlik Ekle</h1>
        <nav aria-label="Ana menü">
            <a href="index.html">Ana Sayfa</a>
            <a href="etkinlikler.html">Etkinlikler</a>
            <a href="etkinlik-ekle.html" aria-current="page">Ekle</a>
        </nav>
    </header>

    <main>
        <p class="form-notu" id="form-giris">Yıldızlı (*) alanlar zorunludur. Bu sprintte form veri kaydetmez; sonuç aşağıda gösterilir.</p>
        <form id="etkinlik-formu" novalidate>
            <div class="alan">
                <label for="ad">Etkinlik adı *</label>
                <input type="text" id="ad" name="ad" required aria-describedby="ad-hata">
                <span class="hata-mesaji" id="ad-hata"></span>
            </div>
            <div class="alan">
                <label for="kategori">Kategori *</label>
                <select id="kategori" name="kategori" required aria-describedby="kategori-hata">
                    <option value="">Seçiniz</option>
                    <option value="Seminer">Seminer</option>
                    <option value="Atölye">Atölye</option>
                    <option value="Söyleşi">Söyleşi</option>
                    <option value="Robotik">Robotik</option>
                    <option value="Oryantasyon">Oryantasyon</option>
                </select>
                <span class="hata-mesaji" id="kategori-hata"></span>
            </div>
            <div class="alan">
                <label for="tarih">Tarih *</label>
                <input type="date" id="tarih" name="tarih" required aria-describedby="tarih-hata">
                <span class="hata-mesaji" id="tarih-hata"></span>
            </div>
            <div class="alan">
                <label for="saat">Saat *</label>
                <input type="time" id="saat" name="saat" required aria-describedby="saat-hata">
                <span class="hata-mesaji" id="saat-hata"></span>
            </div>
            <div class="alan">
                <label for="yer">Yer *</label>
                <input type="text" id="yer" name="yer" required placeholder="Örn. A Blok Konferans Salonu" aria-describedby="yer-hata">
                <span class="hata-mesaji" id="yer-hata"></span>
            </div>
            <div class="alan">
                <label for="kontenjan">Kontenjan</label>
                <input type="number" id="kontenjan" name="kontenjan" min="1" max="1000" inputmode="numeric" aria-describedby="kontenjan-hata">
                <span class="hata-mesaji" id="kontenjan-hata"></span>
            </div>
            <div class="alan">
                <label for="aciklama">Açıklama</label>
                <textarea id="aciklama" name="aciklama" rows="5"></textarea>
            </div>

            <button type="submit">Kaydet</button>
        </form>
        <div id="form-mesaj" class="mesaj" role="status"></div>
    </main>

    <footer>
        <p>Deniz Kapıcı - 2416501067 - SDÜ Bilgisayar Mühendisliği - 2026</p>
    </footer>
</body>
</html>
